[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "anime-character-forge"
version = "0.6.3"
description = "Windows desktop tool for generating AI anime characters — face, body, outfit, palette, pose — via a plugin host."
readme = "CONTRIBUTING.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "The Forge Collective", email = "team@anime-character-forge.dev" },
]
keywords = ["anime", "character-generator", "stable-diffusion", "plugin-host", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "numpy>=2.0,<3",
    "pillow>=10.4",
    "pydantic>=2.8,<3",
    "tomli-w>=1.0",
    "rich>=13.7",
    "watchdog>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
runtime = [
    "onnxruntime-gpu>=1.19; sys_platform == 'win32'",
    "onnxruntime>=1.19; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-Pillow",
]

[project.scripts]
forge = "forge.bootstrap.cli:main"

[project.urls]
Homepage = "https://github.com/anime-character-forge/anime-character-forge"
Issues = "https://github.com/anime-character-forge/anime-character-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["forge"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=forge --cov-report=term-missing"